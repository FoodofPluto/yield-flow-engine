name: Manually run durable Telegram worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-signal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run durable Telegram worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: staging
          FURUFLOW_AUTOMATION_ENABLED: "true"
          FURUFLOW_SYSTEM_TELEGRAM_RULE_ENABLED: "false"

          FURUFLOW_SIGNAL_SOURCE: "defillama"
          FURUFLOW_SIGNAL_MIN_TVL: "1000000"
          FURUFLOW_SIGNAL_MIN_APY: "20"
          FURUFLOW_SIGNAL_MAX_APY: "60"
          FURUFLOW_SIGNAL_MIN_RISK: "3"
          FURUFLOW_SIGNAL_MAX_RISK: "5"
          FURUFLOW_SIGNAL_MIN_STRENGTH: "60"
          FURUFLOW_SIGNAL_MAX_STRENGTH: "65"
          FURUFLOW_SIGNAL_TOP_N: "5"
          FURUFLOW_SIGNAL_SCAN_DEPTH: "250"
          FURUFLOW_SIGNAL_STABLECOIN_ONLY: "false"
          FURUFLOW_SIGNAL_CHAINS: "ethereum,base,arbitrum,optimism,polygon"

          FURUFLOW_SIGNAL_DEBUG: "true"
        run: |
          python ./telegram_worker.py run --invocation-key "manual-github-${{ github.run_id }}-${{ github.run_attempt }}"
