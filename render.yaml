services:
  - type: web
    name: furuflow-staging
    runtime: docker
    plan: free
    region: ohio
    branch: feat/supabase-auth-demo-access
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEV_MODE
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_REDIRECT_URL_PREVIEW
        fromService:
          type: web
          name: furuflow-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_REDIRECT_URL_PRODUCTION
        fromService:
          type: web
          name: furuflow-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: FURUFLOW_SESSION_BROKER_INTERNAL_URL
        value: http://127.0.0.1:8510
      - key: FURUFLOW_SESSION_BROKER_PUBLIC_ORIGIN
        fromService:
          type: web
          name: furuflow-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FURUFLOW_SESSION_ENCRYPTION_KEY
        sync: false
      - key: FURUFLOW_SESSION_BRIDGE_KEY
        generateValue: true
